    - name: "R5-25"
      filename: "Test_dataform_change_air2_R=5-25.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-26"
      filename: "Test_dataform_change_air2_R=5-26.csv"
      inference_strategy: 'sliding_window'

window:
  train_window_mins: 180
  sampling_interval_min: 10
  use_median_downsampling: true
  prediction_length: 18

model:
  name: "transformer_layerwise"
  embedding_dim: 64
  hidden_dim: 64
  n_layers: 2
  num_heads: 1
  activation: 'gelu'
  dropout: 0.1
  ffn_expansion: 4

training:
  device: "cuda"
  seed: 42
  batch_size: 64
  epochs: 1000
  steps_per_epoch: 10
  learning_rate: 0.0005
  ss_loss_weight: 0
  gain_loss_weight: 0.05
  monitor_gain_kci: true
  stepwise_gain_warmup_steps: 35
  dynamic_gain_tail_start_step: 10
  finite_diff_delta_std: 0.5
  ss_batch_size: 64
  inference_strategy: "sliding_window"
  block_commit_steps: 1
  patience: 10
  loss_function: 'mse'
  loss_weighting:
    weights: [1.0, 1.0, 1.0, 1.0]

