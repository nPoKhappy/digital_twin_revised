# Difficult-GradNorm target ratio: 0.02 (2%; comparison ratios: 0.005, 0.01, 0.015).
# IMPORTANT: target ratio is a CLI argument; the trainer does not read it from YAML.
# Run from the project root:
# python scripts/training/train_pgin_stepwise_gain_difficult_group_gradnorm.py --config configs/pgin/difficult_gradnorm/difficult_gradnorm_ratio0p02_no_ss_seed42.yaml --no-ss --target-ratio 0.02 --max-scale 50
# All seven populated sign groups are retained; this is not a group ablation.
# All other model/data/training settings match the original seed42 no-SS config.

exp_name: "pgin_gain005_ratio0p02_seed42_difficult_group_gradnorm_no_ss"


data:
  path: "./data/Claus_dynamic/"
  training_files:
    - "Test_dataform_change_air2_R=5_train_split.csv"
    - "Test_dataform_change_air2_R=5-1_train_split.csv"
    - "Test_dataform_change_air2_R=5-2_train_split.csv"
    - "Test_dataform_change_air2_R=5-6_train_split.csv"

  variables_num: 63

  test_data_split: 0.1
  valid_data_split: 0.1

  inference_files:
    - name: "R5_train_split"
      filename: "Test_dataform_change_air2_R=5_train_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-1_train_split"
      filename: "Test_dataform_change_air2_R=5-1_train_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-2_train_split"
      filename: "Test_dataform_change_air2_R=5-2_train_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-6_train_split"
      filename: "Test_dataform_change_air2_R=5-6_train_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5_test_split"
      filename: "Test_dataform_change_air2_R=5_test_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-1_test_split"
      filename: "Test_dataform_change_air2_R=5-1_test_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-2_test_split"
      filename: "Test_dataform_change_air2_R=5-2_test_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-6_test_split"
      filename: "Test_dataform_change_air2_R=5-6_test_split.csv"
      inference_strategy: 'sliding_window'

    - name: "R5_valid_split"
      filename: "Test_dataform_change_air2_R=5_valid_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-1_valid_split"
      filename: "Test_dataform_change_air2_R=5-1_valid_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-2_valid_split"
      filename: "Test_dataform_change_air2_R=5-2_valid_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-6_valid_split"
      filename: "Test_dataform_change_air2_R=5-6_valid_split.csv"
      inference_strategy: 'sliding_window'

    - name: "R5-13"
      filename: "Test_dataform_change_air2_R=5-13.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-14"
      filename: "Test_dataform_change_air2_R=5-14.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-19"
      filename: "Test_dataform_change_air2_R=5-19.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-20"
      filename: "Test_dataform_change_air2_R=5-20.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-21"
      filename: "Test_dataform_change_air2_R=5-21.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-22"
      filename: "Test_dataform_change_air2_R=5-22.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-23"
      filename: "Test_dataform_change_air2_R=5-23.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-24"
      filename: "Test_dataform_change_air2_R=5-24.csv"
