# Transformer 實驗的設定檔 - 滾動預測 18 步長 - autoregressive training loss # Claus 製程
exp_name: "Transformer_AT_Rolling_Claus_Experiment"

data:
  path: "./data/Claus_dynamic/"  # 數據文件夾路徑
  # 多段訓練數據（不同操作條件的獨立模擬）
  training_files:
    - "training_segment_1.csv"
    - "training_segment_2.csv"
    - "training_segment_3.csv"
  # 每段的數據點數（與 training_files 對應）
  segment_points: [14400, 14400, 14400]
  # 單一檔案模式（如果 training_files 不存在則使用這個）
  filename: "training.csv"
  variables_num: 10 # mv 2 個 qv 2個 dv 5個 sv 1個 total 10個
  point: 14400  # 單一檔案模式時使用
  test_data_split: 0.1      
  valid_data_split: 0.05    
  
  test_data:
    filename: "testing.csv"
    point: 14400

window:
  train_window_mins: 180 
  sampling_interval_min: 10
  prediction_length: 72 # 18 * 4

# --- 模型特定的設定 ---
model:
  name: "transformer" 
  embedding_dim: 34   
  hidden_dim: 34
  n_layers: 3

training:
  device: "cuda"
  batch_size: 1024     # 這個數值越大 記憶體需求越高 但是訓練會比較快
  epochs: 10000     # 訓練的最大迭代次數
  learning_rate: 0.001 # Adam 的預設值
  patience: 100 # 早停的耐心值
  loss_weighting:
    weights: [1.0, 1.0, 1.0, 1.0]
  inference_strategy: 'sliding_window' # rolling prediction