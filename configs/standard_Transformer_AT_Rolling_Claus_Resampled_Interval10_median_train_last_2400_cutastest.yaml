exp_name: "Standard_Transformer_AT_Rolling_Claus_Resampled_Interval_10_median_train_last_2400_cutastest"

data:
  path: "./data/Claus_dynamic/"
  training_files:
    - "R5_Train_Part.csv" # The first 80% (12000 pts)
  
  # Variables & Data Config
  variables_num: 8 
  point: 12000 # Use full length of the split file
  test_data_split: 0.0 # No more internal splitting, we did it manually
  valid_data_split: 0.2 # 20% to ensure enough validation samples (approx 100+)
  
  test_data:
    filename: "R5_ID_Test_Part.csv" 
    point: 2400
    
  inference_files:
    - name: "Training_Data_Horizon_Check" # 每個 prediction_length 之後重製 在horizon一次 4000個點
      filename: "R5_Train_Part.csv"
      point: 4000 # Check first 4000 points of training data
      inference_strategy: 'horizon_reinit' # Use the new Horizon Re-init strategy
    - name: "ID_Testing_Held_Out"
      filename: "R5_ID_Test_Part.csv" # The physical last 20%
      point: 2400
    - name: "OOD_Testing_R5-1"
      filename: "Test_dataform_change_air2_R=5-1.csv"
      point: 2400
    - name: "OOD_Testing_R5-2"
      filename: "Test_dataform_change_air2_R=5-2.csv"
      point: 2400
    - name: "OOD_Testing_R5-3"
      filename: "Test_dataform_change_air2_R=5-3.xlsx"
      point: 2400
    - name: "OOD_Testing_R5-4"
      filename: "Test_dataform_change_air2_R=5-4.xlsx"
      point: 2400
    - name: "OOD_Testing_R5-5"
      filename: "Test_dataform_change_air2_R=5-5.xlsx"
      point: 2400
    - name: "OOD_Testing_R5-6"
      filename: "Test_dataform_change_air2_R=5-6.csv"
      point: 2400

window:
  train_window_mins: 220    # 22 steps * 10 min (Matches GRU 'pastDay=22')
  sampling_interval_min: 10 
  use_median_downsampling: true 
  prediction_length: 12     # 12 steps * 10 min (Matches GRU 'futureDay=12')

model:
  name: "transformer" 
  embedding_dim: 64      # Keep high dim
  hidden_dim: 128        
  n_layers: 2           
  num_heads: 2           # GRU uses units=15, Let's give Transformer 2 heads for 64 dim
  activation: 'relu'    # Matches GRU
  dropout: 0.1          # Add a bit of dropout like GRU probably benefits from

training:
  device: "cuda"
  batch_size: 128        # Matches GRU
  epochs: 10000 
  learning_rate: 0.001   # GRU used 0.0001 (1e-4), maybe we should lower it too? Let's stick to 1e-3 first or 1e-4. GRU converges slow. 
                         # Let's use 1e-3 because Transformer trains faster.
  patience: 100
  loss_weighting:
    weights: [1.0]       # prediction_length is short (12), maybe no need for block rolling if H is small?
                         # Wait, prediction_length=12 is very short.
                         # If we keep 'sliding_window' strategy, it predicts 1 step a time.
                         # If we use 'block_replacement', it predicts all H steps.
                         # GRU is Seq2Seq (predicts 12 at once). So we should treat H=12 as ONE block.
  inference_strategy: 'block_replacement' # Matches GRU behavior (predict vector)
  epochs: 10000 
  learning_rate: 0.001
  patience: 100
  loss_weighting:
    weights: [1.0, 1.0, 1.0, 1.0] 
  inference_strategy: 'sliding_window'
