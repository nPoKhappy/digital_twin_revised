exp_name: "transformer_layerwise_71var_decoder_input_sp_PGIN_From_Scratch"

data:
  path: "./data/Claus_dynamic/"
  training_files:
    - "Test_dataform_change_air2_R=5_converted.csv"
    - "Test_dataform_change_air2_R=5-1_converted.csv"
    - "Test_dataform_change_air2_R=5-2_converted.csv"
    - "Test_dataform_change_air2_R=5-6_converted.csv"
  
  variables_num: 72
  
  test_data_split: 0.1
  valid_data_split: 0.1
  
  inference_files: 
    - name: "R5_converted"
      filename: "Test_dataform_change_air2_R=5_converted.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-1_converted"
      filename: "Test_dataform_change_air2_R=5-1_converted.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-2_converted"
      filename: "Test_dataform_change_air2_R=5-2_converted.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-6_converted"
      filename: "Test_dataform_change_air2_R=5-6_converted.csv"
      inference_strategy: 'sliding_window'
    - name: "R5_test_split"
      filename: "Test_dataform_change_air2_R=5_converted_test_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-1_test_split"
      filename: "Test_dataform_change_air2_R=5-1_converted_test_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-2_test_split"
      filename: "Test_dataform_change_air2_R=5-2_converted_test_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-6_test_split"
      filename: "Test_dataform_change_air2_R=5-6_converted_test_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5_valid_split"
      filename: "Test_dataform_change_air2_R=5_converted_valid_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-1_valid_split"
      filename: "Test_dataform_change_air2_R=5-1_converted_valid_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-2_valid_split"
      filename: "Test_dataform_change_air2_R=5-2_converted_valid_split.csv"
      inference_strategy: 'sliding_window'
    - name: "R5-6_valid_split"
      filename: "Test_dataform_change_air2_R=5-6_converted_valid_split.csv"
      inference_strategy: 'sliding_window'


window:
  train_window_mins: 180    # 18 steps * 10 min
  sampling_interval_min: 10 
  use_median_downsampling: true 
  prediction_length: 18       # 18 steps

model:
  name: "transformer_layerwise"
  embedding_dim: 64     # Adjusted for ~60 variables (57 + pos) -> closest power of 2 or multiple of heads
  hidden_dim: 64       
  n_layers: 2
  num_heads: 1          # 64 is divisible by 1 (and 2, 4)
  activation: 'gelu'
  dropout: 0.0
  ffn_expansion: 4      

training:
  device: "cuda"
  batch_size: 64
  epochs: 10000
  learning_rate: 0.0005
  patience: 20
  loss_function: 'mse'
  pgin_loss_weight: 100
  loss_weighting:
    weights: [1.0, 1.0, 1.0, 1.0]
  
